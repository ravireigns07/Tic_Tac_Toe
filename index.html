<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./styles.css?v=3" />
  </head>
  <body>
    <main class="app">
      <h1>🎮 Tic Tac Toe</h1>

      <section id="setupPanel" class="panel">
        <label for="nameInput">Enter your name to start</label>
        <input id="nameInput" maxlength="20" placeholder="Your name" autocomplete="off" />
        <div class="controls" style="margin-top: 12px;">
          <button id="nameSubmitBtn">Start Game</button>
        </div>
        <p id="setupStatus" class="status">Enter your name to begin.</p>
      </section>

      <section id="gamePanel" class="panel hidden">
        <p class="subtitle" style="margin:0 0 12px;font-size:0.95rem;">Play online or vs Computer</p>
        <div class="controls">
          <button id="createBtn">🎲 Create Game</button>
          <button id="joinBtn">🔗 Join Game</button>
          <button id="soloBtn">🤖 vs Computer</button>
          <button id="resetBtn" class="secondary">↺ Reset</button>
        </div>

        <label id="codeLabel" for="codeInput" class="hidden">Enter your friend's game code</label>
        <div class="code-input-row hidden" id="codeInputRow">
          <input id="codeInput" maxlength="6" placeholder="Enter code" autocomplete="off" inputmode="text" />
          <button id="enterBtn" class="enter-btn hidden">Join</button>
        </div>
        <div id="shareCodeBox" class="share-code-box hidden">
          <div class="share-code-label">🎯 Share this code with your friend</div>
          <div class="share-code-value" id="shareCodeValue"></div>
          <button id="copyCodeBtn" class="copy-btn">📋 Copy Code</button>
        </div>
        <p id="status" class="status">Create a game to get your code, or join with a friend's code.</p>
      </section>

      <section id="gameCard" class="game-card hidden">
        <div class="game-card-top">
          <button id="exitBtn" class="secondary">✕ Exit</button>
        </div>
        <div class="info-bar">
          <span id="turnInfo">Waiting for a game...</span>
          <span id="playerInfo">You: —</span>
        </div>
        <div id="scoreCard" class="score-card">
          <div class="score-player">
            <strong id="myNameLabel">You</strong>
            <span id="myScore">0</span>
          </div>
          <div class="score-middle">
            <div>Draws</div>
            <div id="scoreSummary">0</div>
          <div class="score-player">
            <strong id="opponentNameLabel">Opponent</strong>
            <span id="opponentScore">0</span>
          </div>
        <div class="board" id="board">
          <button class="cell" data-index="0"></button>
          <button class="cell" data-index="1"></button>
          <button class="cell" data-index="2"></button>
          <button class="cell" data-index="3"></button>
          <button class="cell" data-index="4"></button>
          <button class="cell" data-index="5"></button>
          <button class="cell" data-index="6"></button>
          <button class="cell" data-index="7"></button>
          <button class="cell" data-index="8"></button>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="./app.js?v=3"></script>
  </body>
</html>
