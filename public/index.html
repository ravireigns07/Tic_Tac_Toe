<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe Online</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Tic Tac Toe Online</h1>
      <p class="subtitle">Play head-to-head with another player in real time.</p>

      <section id="setupPanel" class="panel">
        <label for="nameInput">Enter your name to start</label>
        <input id="nameInput" maxlength="20" placeholder="Your name" />
        <div class="controls" style="margin-top: 12px;">
          <button id="nameSubmitBtn">Start Game</button>
        </div>
        <p id="setupStatus" class="status">Enter your name to begin.</p>
      </section>

      <section id="gamePanel" class="panel hidden">
        <div class="controls">
          <button id="joinBtn">Find Match</button>
          <button id="resetBtn" class="secondary">Reset</button>
        </div>
        <p id="status" class="status">Enter a name to start playing.</p>
      </section>

      <section id="gameCard" class="game-card hidden">
        <div class="game-card-top">
          <button id="exitBtn" class="secondary hidden">Exit</button>
        </div>
        <div class="info-bar">
          <span id="turnInfo">Waiting for a match...</span>
          <span id="playerInfo">You: —</span>
        </div>
        <div id="scoreCard" class="score-card">
          <div class="score-player">
            <strong id="myNameLabel">You</strong>
            <span id="myScore">0</span>
          </div>
          <div class="score-middle">
            <div>Draws</div>
            <div id="scoreSummary">0</div>
          </div>
          <div class="score-player">
            <strong id="opponentNameLabel">Opponent</strong>
            <span id="opponentScore">0</span>
          </div>
        </div>
        <div class="board" id="board">
          <button class="cell" data-index="0"></button>
          <button class="cell" data-index="1"></button>
          <button class="cell" data-index="2"></button>
          <button class="cell" data-index="3"></button>
          <button class="cell" data-index="4"></button>
          <button class="cell" data-index="5"></button>
          <button class="cell" data-index="6"></button>
          <button class="cell" data-index="7"></button>
          <button class="cell" data-index="8"></button>
        </div>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
